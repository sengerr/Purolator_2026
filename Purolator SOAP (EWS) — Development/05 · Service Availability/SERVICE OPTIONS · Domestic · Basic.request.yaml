$kind: http-request
description: ServiceAvailabilityServiceEndpoint.GetServicesOptions — Developer Test Aid case “05. Domestic destination”.
url: "{{soapBase}}/EWS/V2/ServiceAvailability/ServiceAvailabilityService.asmx"
method: POST
headers:
