$kind: http-request
description: |-
  SOAP request from the team sample “Quick Estimate .txt” (parity with the REST request of the same name).
url: "{{soapBase}}/EWS/V2/Estimating/EstimatingService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v2/GetQuickEstimate
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:v2="http://purolator.com/pws/datatypes/v2">
       <soapenv:Header>
          <v2:RequestContext>
             <v2:Version>2.2</v2:Version>
             <v2:Language>en</v2:Language>
             <v2:GroupID/>
             <v2:RequestReference>Test</v2:RequestReference>

             <v2:UserToken></v2:UserToken>
          </v2:RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <v2:GetQuickEstimateRequest>
             <v2:BillingAccountNumber>{{AccountNumber}}</v2:BillingAccountNumber>
             <v2:SenderPostalCode>t5s2n4</v2:SenderPostalCode>
             <v2:ReceiverAddress>
                <v2:City>Richmond</v2:City>
                <v2:Province>BC</v2:Province>
                <v2:Country>CA</v2:Country>
                <v2:PostalCode>V7B1M5</v2:PostalCode>
             </v2:ReceiverAddress>
             <v2:PackageType>CustomerPackaging</v2:PackageType>

             <v2:TotalWeight>
                <v2:Value>3</v2:Value>
                <v2:WeightUnit>lb</v2:WeightUnit>
             </v2:TotalWeight>
          </v2:GetQuickEstimateRequest>
       </soapenv:Body>
    </soapenv:Envelope>
auth:
  type: basic
  credentials:
    username: "{{SOAP_Key}}"
    password: "{{SOAP_Password}}"
order: 7000
