$kind: http-request
description: EstimatingServiceEndpoint.GetQuickEstimate — Developer Test Aid case “03. US shipment”.
url: "{{soapBase}}/EWS/V2/Estimating/EstimatingService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v2/GetQuickEstimate
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:v2="http://purolator.com/pws/datatypes/v2">
       <soapenv:Header>
          <v2:RequestContext>
           <v2:Version>2.0</v2:Version>
             <v2:Language>en</v2:Language>
             <v2:GroupID>1</v2:GroupID>
             <v2:RequestReference>UserRef</v2:RequestReference>
          </v2:RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <v2:GetQuickEstimateRequest>
             <v2:BillingAccountNumber>{{AccountNumber}}</v2:BillingAccountNumber>
             <v2:SenderPostalCode>T5S2N4</v2:SenderPostalCode>
             <v2:ReceiverAddress>
                <v2:City>Compton</v2:City>
                <v2:Province>CA</v2:Province>
                <v2:Country>US</v2:Country>
                <v2:PostalCode>90220</v2:PostalCode>
             </v2:ReceiverAddress>
             <!--Optional:-->
             <v2:PackageType>ExpressPack</v2:PackageType>
             <!--Optional:-->
             <v2:TotalWeight>
                <v2:Value>10</v2:Value>
                <v2:WeightUnit>lb</v2:WeightUnit>
             </v2:TotalWeight>
          </v2:GetQuickEstimateRequest>
       </soapenv:Body>
    </soapenv:Envelope>
auth:
  type: basic
  credentials:
    username: "{{SOAP_Key}}"
    password: "{{SOAP_Password}}"
order: 3000
