$kind: http-request
description: TrackingServiceEndpoint.GetDeliveryDetails — Developer Test Aid case “01.Delivery details”.
url: "{{soapBase}}/EWS/V1/Tracking/TrackingService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v1/GetDeliveryDetails
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:v1="http://purolator.com/pws/datatypes/v1">
       <soapenv:Header>
          <v1:RequestContext>
             <v1:Version>1.2</v1:Version>
             <v1:Language>en</v1:Language>
             <v1:GroupID/>
             <v1:RequestReference>REF1</v1:RequestReference>
             <!--Optional:-->
             <v1:UserToken/>
          </v1:RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <v1:GetDeliveryDetailsRequest>
             <v1:PIN>
                <v1:Value>{{PIN}}</v1:Value>
             </v1:PIN>
          </v1:GetDeliveryDetailsRequest>
       </soapenv:Body>
    </soapenv:Envelope>
auth:
  type: basic
  credentials:
    username: "{{SOAP_Key}}"
    password: "{{SOAP_Password}}"
order: 1000
