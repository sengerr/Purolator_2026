scripts:
  - type: beforeRequest
    code: |-
      // Create-shipment pre-request — shipment date is TODAY + 5 DAYS.
      // Runs after the collection pre-request, so it overwrites the Current_Date
      // that script just set to today. Five days ahead keeps the date inside the
      // carrier's future-dating window and off weekends-only edge cases.
      const DAYS_AHEAD = 5;

      const d = new Date();
      d.setDate(d.getDate() + DAYS_AHEAD);

      // Carrier timezone, not the runner's -- see 9001-11.
      const shipDate = d.toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });

      pm.environment.set('Current_Date', shipDate);
      console.log('[ship date] ' + shipDate + ' (today + ' + DAYS_AHEAD + ' days)');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Response is JSON', function () {
          pm.response.to.be.json;
      });
      const json = pm.response.json();
      pm.test('validShipment is true or omitted without hard errors', function () {
          if (json.hasOwnProperty('validShipment')) {
              pm.expect(json.validShipment).to.eql(true);
          }
      });
      pm.test('shipmentDetails.shipmentPIN is present', function () {
          pm.expect(json.shipmentDetails).to.be.an('object');
          pm.expect(json.shipmentDetails.shipmentPIN).to.be.a('string').and.not.empty;
          pm.environment.set('PIN', json.shipmentDetails.shipmentPIN);
      });
      pm.test('packagePINs array present when created', function () {
          if (json.shipmentDetails && json.shipmentDetails.packagePINs) {
              pm.expect(json.shipmentDetails.packagePINs).to.be.an('array').that.is.not.empty;
          }
      });
    language: text/javascript
order: 951700
