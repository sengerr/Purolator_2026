$kind: http-request
description: |-
  OAS: documentCriteria 1–50. Demo multi-PIN support workflow when Create omitted docs for size.

  Source: Purolator-REST-API-STG collection, "POST Documents - batch 2 PINs". REST only (no SOAP twin, 2026-10-06).
url: "{{baseUrl}}/ship/v1/documents"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  Language: "{{language}}"
  RequestReference: "{{RequestReference}}"
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
        "lineOfBusiness": "Courier",
        "documentCriteria": [
            {
                "shipmentPIN": "{{PIN}}"
            },
            {
                "shipmentPIN": "{{PIN2}}"
            }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{REST_Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('requestReference present', function () { pm.expect(json.requestReference).to.exist; });
      if (json.shipmentDocuments) {
        pm.test('shipmentDocuments is array', function () { pm.expect(json.shipmentDocuments).to.be.an('array'); });
      }
    language: text/javascript
order: 952700
