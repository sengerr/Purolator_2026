$kind: http-request
description: |-
  OAS/cheat sheet happy path. Dates must be today-10..today. Empty batches usually mean manifest never closed. Expected 200.

  Source: Purolator-REST-API-STG collection, "POST Summary Manifest - happy today". REST only (no SOAP twin, 2026-10-06).
url: "{{baseUrl}}/ship/v1/documents/summary-manifest"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  Language: "{{language}}"
  RequestReference: "{{RequestReference}}"
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
        "lineOfBusiness": "Courier",
        "manifestDate": [
            "{{manifestDate}}"
        ],
        "requestReference": "{{RequestReference}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{REST_Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('requestReference present', function () { pm.expect(json.requestReference).to.exist; });
      console.log('manifestBatch length:', (json.manifestBatch || []).length);
      // Empty manifestBatch for a valid date usually means Close Manifest was not run that day (not necessarily HTTP error).
    language: text/javascript
order: 953300
