$kind: http-request
description: |-
  Outbound Express plus returnShipment (Ground). Response may include returnShipmentEstimates.

  Source: Purolator-REST-API-STG collection, "Estimate - Courier with return shipment". REST only (no SOAP twin, 2026-10-06).
url: "{{rateBaseUrl}}/rate/v1/shipment"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  Language: "{{language}}"
  RequestReference: "{{RequestReference}}"
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
        "lineOfBusiness": "Courier",
        "shipmentDate": "{{Current_Date}}",
        "outboundShipment": {
            "billingInformation": {
                "billingAccountNumber": "{{AccountNumber}}",
                "displayPublishedRates": false
            },
            "senderInformation": {
                "companyName": "Purolator",
                "streetAddress": [
                    "17718 114 Ave"
                ],
                "city": "Edmonton",
                "provinceStateCode": "AB",
                "country": "CA",
                "postalZipCode": "T5S2N4"
            },
            "receiverInformation": {
                "companyName": "Purolator",
                "streetAddress": [
                    "3700 Jericho Road"
                ],
                "city": "Richmond",
                "provinceStateCode": "BC",
                "country": "CA",
                "postalZipCode": "V7B1M5"
            },
            "shipmentInformation": {
                "serviceId": "PurolatorExpress",
                "unitOfMeasurement": "Metric",
                "showAlternativeServicesIndicator": false,
                "totalWeight": 2.5,
                "totalPackages": 1,
                "packageInformation": [
                    {
                        "packageWeight": 2.5
                    }
                ]
            }
        },
        "returnShipment": {
            "numberOfReturnShipments": 1,
            "billingInformation": {
                "billingAccountNumber": "{{AccountNumber}}",
                "displayPublishedRates": false
            },
            "senderInformation": {
                "companyName": "Purolator",
                "streetAddress": [
                    "17718 114 Ave"
                ],
                "city": "Edmonton",
                "provinceStateCode": "AB",
                "country": "CA",
                "postalZipCode": "T5S2N4"
            },
            "receiverInformation": {
                "companyName": "Purolator",
                "streetAddress": [
                    "3700 Jericho Road"
                ],
                "city": "Richmond",
                "provinceStateCode": "BC",
                "country": "CA",
                "postalZipCode": "V7B1M5"
            },
            "shipmentInformation": {
                "serviceId": "PurolatorGroundReturn",
