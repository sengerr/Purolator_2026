$kind: http-request
description: |-
  pod=true asks for proof of delivery image (signature/scanner photo) in package.details.deliveryDetails.image. Only populated once delivered. eventSortOrder a = ascending.

  Source: Purolator-REST-API-STG collection, "Track - with POD image and ascending events". REST only (no SOAP twin, 2026-10-06).
url: "{{baseUrl}}/track/v1/shipment"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
        "language": "en",
        "search": [
            {
                "trackingId": "{{PIN}}",
                "pod": true,
                "eventSortOrder": "a"
            }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{REST_Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('searchResult array present', function () { pm.expect(json.searchResult).to.be.an('array'); });
      (json.searchResult || []).forEach(function (r, i) {
          const p = r.pin || {};
          console.log('search[' + i + ']', p.trackingId, 'status=', p.status, 'type=', p.type);
      });
      pm.test('Events present when found (informational)', function () {
          const s = ((json.searchResult || [])[0] || {}).pin || {};
          if (s.shipment && s.shipment.package) { pm.expect(s.shipment.package).to.be.an('array'); }
      });
    language: text/javascript
order: 956300
