$kind: http-request
description: |-
  SOAP twin of the REST request of the same name, rebuilt from its JSON onto the SOAP lane template. REST description: Consolidation check step 7 of 10. Converted from the SOAP sample "consolidate.txt". Closes the manifest for everything created above. REST has no published consolidate spec; /ship/v1/manifest is a behavioural match - see docs/not-converted.md.
url: "{{soapBase}}/EWS/V2/Shipping/ShippingService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v2/Consolidate
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:v2="http://purolator.com/pws/datatypes/v2">
       <soapenv:Header>
          <v2:RequestContext>
             <v2:Version>2.0</v2:Version>
             <v2:Language>en</v2:Language>
             <v2:GroupID>123</v2:GroupID>
             <v2:RequestReference>UserRef</v2:RequestReference>
          </v2:RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <v2:ConsolidateRequest/>
       </soapenv:Body>
    </soapenv:Envelope>
auth:
  type: basic
  credentials:
    username: "{{SOAP_Key}}"
    password: "{{SOAP_Password}}"
order: 7000
