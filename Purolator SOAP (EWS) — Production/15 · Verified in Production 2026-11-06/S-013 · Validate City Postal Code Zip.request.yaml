  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns="http://purolator.com/pws/datatypes/v2">
       <soapenv:Header>
          <RequestContext>
             <Version>2.0</Version>
             <Language>en</Language>
             <GroupID>1</GroupID>
             <RequestReference>{{RequestReference}}</RequestReference>
          </RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <ValidateCityPostalCodeZipRequest>
             <Addresses>
                <ShortAddress>
                   <City>Mississauga</City>
                   <Province>ON</Province>
                   <Country>CA</Country>
                   <PostalCode>L5R3T8</PostalCode>
                </ShortAddress>
             </Addresses>
          </ValidateCityPostalCodeZipRequest>
       </soapenv:Body>
    </soapenv:Envelope>
auth:
