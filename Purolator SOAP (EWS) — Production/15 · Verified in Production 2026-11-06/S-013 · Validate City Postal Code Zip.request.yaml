$kind: http-request
description: |-
  Verified in Production 2026-11-06 — Purolator_Certification_Testing row S-013 (Validate City Postal Code Zip).
  Expected outcome: HTTP 200 · ValidateCityPostalCodeZipResponse · ResponseInformation/Errors empty · a result for each address (valid, or suggested corrections)
  Placeholders in the body: RequestReference.
  Production calls create real shipments and pickups — void anything you create.
url: "{{soapBase}}/EWS/V2/ServiceAvailability/ServiceAvailabilityService.asmx"
method: POST
headers:
