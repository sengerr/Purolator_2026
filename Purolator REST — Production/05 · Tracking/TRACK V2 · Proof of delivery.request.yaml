$kind: http-request
description: |-
  REST twin of the SOAP request of the same name (converted with tooling/generators). ShipmentTrackingServiceEndpoint.TrackingByPinsOrReferences — v2. pod=true asks for the proof-of-delivery detail. In v1 this was a separate GetDeliveryDetails call. v2 ShipmentTracking exposes this single operation; v1's TrackPackagesByPin, TrackPackagesByReference and GetDeliveryDetails are all folded into it. SOAP v2 tracking already uses the REST search field names — mapped through directly.
url: "{{baseUrl}}/track/v1/shipment"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  RequestReference: "{{RequestReference}}"
  Language: "{{language}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "language": "{{language}}",
        "search": [
            {
                "trackingId": "{{trackingId}}"
            }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{REST_Token}}"
order: 7000
