$kind: http-request
description: |-
  Verified in Production 2026-11-06 — Purolator_Certification_Testing row R-008 (Schedule pickup).
  Expected outcome: HTTP 200 · pickup scheduled · confirmation number returned
  Placeholders in the body: AccountNumber, pickupDate.
  Production calls create real shipments and pickups — void anything you create.
url: "{{baseUrl}}/pickup/v1/schedule"
method: POST
headers:
  x-api-key: "{{REST_XApiKey}}"
  RequestReference: "{{RequestReference}}"
  Language: "{{language}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lineOfBusiness": "Courier",
      "registeredAccountNumber": "{{AccountNumber}}",
      "pickupInstructions": {
        "date": "{{pickupDate}}",
        "anyTimeAfter": "13:00",
        "untilTime": "17:00",
        "measurementUnit": "Imperial",
        "pickupLocation": "FrontDesk",
        "additionalInstructions": "Sample pickup"
      },
      "pickupAddress": {
        "address": [
          "5995 Avebury Rd"
        ],
        "city": "Mississauga",
        "province": "ON",
        "country": "CA",
        "postalCode": "L5R3T8"
      },
      "shipmentSummary": [
        {
          "destinationCode": "DOM",
          "modeOfTransport": "Ground",
          "totalPieces": 1,
          "totalWeight": 5
        }
      ],
      "contactInfo": {
        "name": "Shipping",
        "company": "Sample Co",
        "phoneNumber": "4161234567"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{REST_Token}}"
scripts:
  - type: afterResponse
    code: |-
      // Save the pickup confirmation number for the modify, history and void requests.
      const PICKUP_VAR = 'PickUpConfirmationNumber';
      const m = pm.response.text().match(/"pickupConfirmationNumber"\s*:\s*"?([A-Za-z0-9]+)/);
      const n = m ? m[1] : null;
      if (n) { pm.environment.set(PICKUP_VAR, String(n)); console.log('[pickup] ' + n); }
    language: text/javascript
order: 100
